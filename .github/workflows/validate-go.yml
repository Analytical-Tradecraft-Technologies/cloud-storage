name: Validate Go

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate module
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: golang/storage/providercontracts/go.mod
          cache: false

      - name: Check Go formatting
        run: make fmt

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build packages
        run: make build
